[colors]
background = #0e131f
background-alt = #182030
foreground = #b8c7e0
primary = #4a7bb0
secondary = #5282bd
alert = #ba5d68
disabled = #32425e
green = #5b8c67

[bar/example]
monitor = ${env:MONITOR:}
override-redirect = true
height = 24pt
width = 90%
offset-x = 5%
offset-y = 4pt
radius = 8

#modules-right = wlan battery cpu memory date

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt

border-size = 0pt
padding-left = 1
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = monospace:size=10;2
font-1 = Noto Sans:size=10;2

modules-left = xworkspaces xwindow
modules-right = battery cpu memory wlan date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/xworkspaces]
type = internal/i3

label-focused = %name%
label-focused-background = ${colors.background-alt}
label-focused-underline= ${colors.primary}
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-padding = 1

label-visible = %name%
label-visible-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:30:...%
label-foreground = ${colors.secondary}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.foreground}

[settings]
screenchange-reload = true
pseudo-transparency = false

[module/wlan]
type = internal/network
interface = wlp3s0
interval = 5.0

format-connected = <label-connected>
format-connected-prefix = "WIFI "
format-connected-prefix-foreground = ${colors.primary}
label-connected = %essid% %signal%%
label-connected-foreground = ${colors.foreground}

format-disconnected = <label-disconnected>
format-disconnected-prefix = "WIFI "
format-disconnected-prefix-foreground = ${colors.alert}
label-disconnected = Disconnected
label-disconnected-foreground = ${colors.disabled}

[module/battery]
type = internal/battery
full-at = 99
low-at = 15

battery = BAT1
adapter = AC
poll-interval = 5

format-charging = <label-charging>
format-charging-prefix = "BAT "
format-charging-prefix-foreground = ${colors.green}
label-charging = %percentage%%+

format-discharging = <label-discharging>
format-discharging-prefix = "BAT "
format-discharging-prefix-foreground = ${colors.primary}
label-discharging = %percentage%%

format-full = <label-full>
format-full-prefix = "BAT "
format-full-prefix-foreground = ${colors.primary}
label-full = 100%

format-low = <label-low>
format-low-prefix = "BAT "
format-low-prefix-foreground = ${colors.alert}
label-low = %percentage%%!
